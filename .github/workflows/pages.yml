name: Pages

on:
  # 仓库需先在 Settings → Pages 启用（推荐 main /docs 分支模式：docs/playground.js 已入库，零构建）。
  # 若选择 Actions 模式并希望 push 自动部署，取消下面 push 块的注释。
  # push:
  #   branches: [main]
  #   paths:
  #     - "docs/**"
  #     - "playground/**"
  #     - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- latest
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Build playground (js)
        run: moon build --target js --release playground
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp _build/js/release/build/playground/playground.js _site/playground.js
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
