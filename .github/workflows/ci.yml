name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Format check
        run: moon fmt --check

      - name: Type check (strict, all targets)
        run: moon check --target all --warn-list +73 --deny-warn

      - name: Build (all targets)
        run: moon build --target all --warn-list +73 --deny-warn

      - name: Test (all targets)
        run: moon test --target all --warn-list +73 --deny-warn

      - name: Update interface files
        run: moon info --target all
